# rcmd configuration file
# Edit this file to customise rcmd's behaviour. Changes are picked up within a few seconds.
# Full settings reference: run `rcmd config help`

# true: settings this file leaves out reset to defaults on every read
overrideUserDefaults: false

triggers:
  triggerKeys: [rcmd]
  windowTriggerKeys: []
  stageTriggerKeys: [fn]
  secondTriggerGestures: [doubleTap]
  enableAssignHotkey: true
  enableHideOthersHotkey: true
  assignKeyTriggerKeys: [rcmd, ralt]
  hideOnFocusTriggerKeys: [rcmd, lshift]
  alwaysHideOthers: false
  doubleTapGapMs: 250
  doubleTapMaxPressMs: 250

# trigger + key → app
appKeyAssignments:
  c: {app: /Applications/Google Chrome.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  e: {app: /Applications/Microsoft Edge.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  g: {app: /Applications/Ghostty.app, launchIfNotRunning: true, whenAlreadyFocusedAction: FollowGlobal}
  i: {app: /Applications/Island.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  j: {app: /Applications/Cursor.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  o: {app: /Applications/Microsoft Outlook.app, launchIfNotRunning: true, whenAlreadyFocusedAction: FollowGlobal}
  p: {app: /Applications/Microsoft PowerPoint.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  t: {app: /Applications/Microsoft Teams.app, launchIfNotRunning: true, whenAlreadyFocusedAction: FollowGlobal}
  u: {app: /System/Applications/Calculator.app, launchIfNotRunning: true, whenAlreadyFocusedAction: FollowGlobal}
  v: {app: /Applications/Visual Studio Code.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  w: {app: /Applications/Microsoft Word.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}
  x: {app: /Applications/Microsoft Excel.app, launchIfNotRunning: true, whenAlreadyFocusedAction: CycleWindows}

# app → letter → saved window
windowKeyAssignments: {}

stages: []

# typed query → the app it always opens
searchPins: {}

appSwitcher:
  showAppSwitcher: true
  appSwitcherOSDDelay: 350
  adaptiveFollowupGraceMs: 150
  appSwitcherFeatures: [lastWindow, runningApps, launchableApps, bottomActions]
  switcherScreenPlacement: {position: center, offsetX: 0, offsetY: 150}
  osdSize: {width: 600, height: 550}
  actionKeys: {hideKey: minus, actionKey: equal, exposeKey: period, enableHideAndActionKeys: true}
  hideOnlyFocusedAppOnMinus: false
  appSort: key
  appSortReverse: false

windowSwitcher:
  windowSwitcherOSDDelay: 0
  windowSwitcherAppearance: clean
  osdLook:
    density: comfortable
    backgroundStyle:
      glass: {opacity: 0}
    accentColor: system
    foregroundColor: adaptive
    keycapColor: adaptive
    keycapStyle: badge
    searchBarStyle: glassy
    cornerRadius: 14
    appIconSize: 30
    iconStyle: native
    fontStyle: rounded
    focusStyle: bar
    rowSeparationStyle: filled
  activeThemeID: companion
  windowSwitcherFeatures: [lastWindow, windows, windowActions, bottomActions]
  windowSwitcherDimFocused: false
  windowSwitcherPlacement: {mirrorAppSwitcher: true}
  osdSize: {width: 600, height: 550}
  actionKeys: {windowMinimizeKey: minus, windowAssignKey: equal, enableWindowMinimizeAndAssignKeys: true}
  minimizeOnlyFocusedWindowOnMinus: true

stageSwitcher: {actionKeys: {stageAssignKey: equal, stageCloseKey: minus, stageRepositionKey: section, stageCloseAction: moveOffScreen}, stageReopenClosedItems: true, showStageSwitcher: true}

tabCycle:
  enableTabCycle: true
  tabCycleScope: auto
  tabCycleSearchScope: allWindows
  tabCycleInclude: [hidden]
  hijackCommandTab: false
  disableSystemCommandTabHotkey: false
  stickyAppSwitcher: false
  stickyAppSwitcherScope: rcmdOnly
  windowCycleKey: grave
  enableWindowCycleKey: true
  hijackWindowCycleHotkey: false

spaces: {spaceMode: multi, createMissingSpaces: true, osdOnActiveSpaceOnly: false, enableInstantSpaceSwitching: true}

general:
  whenAlreadyFocusedAction: Hide
  focusBehaviour: mainWindow
  focusBehaviourSingle: mainWindow
  focusBehaviourMulti: mainWindow
  focusOnKeyUp: false
  activationMode: onPress
  searchMatchMode: contains
  osdDisplay: activeWindow
  searchOptionalPrefixes:
  - google
  - microsoft
  - adobe
  - apple
  - amazon
  - affinity
  - jetbrains
  - nvidia
  - parallels
  - elgato
  - logitech
  - synology
  - wondershare
  - the
  - 4k
  - 8k
  - 3d
  showMenubarAppsInSearch: false
  showLensItemsInSearch: true
  lensRowCap: 30
  lensFetchFavicons: true
  enableQuickKeys: true
  editorApp: ''
  terminalApp: ''
  enableStickySpaceSearch: true

# bundle IDs rcmd never lists
ignoredApps: []

# keys rcmd never takes
ignoredKeys: []

# bundle IDs where rcmd stops intercepting keys
appsWhereRcmdIsPaused: []

windowPatternGroups:
- id: code-editors
  name: Code editor project
  bundleIDs:
  - com.microsoft.VSCode
  - com.microsoft.VSCodeInsiders
  - com.microsoft.VSCodiumInsiders
  - com.microsoft.VSCod
  - com.qoder.ide
  - com.visualstudio.code
  - com.visualstudio.code.oss
  - com.sublimetext.4
  - com.sublimetext.3
  - com.sublimetext.2
  - com.sublimetext.
  - com.todesktop.
  keyPattern: ".* \u2014 [^\\w\\d]*(.)"
  titlePattern: ".* \u2014 (.+)$"
- {id: jetbrains, name: JetBrains IDEs, bundleIDs: [com.jetbrains.], keyPattern: '', titlePattern: "^(.+?)(?: \\[.+\\])? [\u2013\u2014] "}
- {id: safari, name: Safari, bundleIDs: [com.apple.Safari], keyPattern: "^.+? \u2014 [^\\w\\d]*(.)", titlePattern: "^.+? \u2014 (.+)$"}
- {id: xcode, name: Xcode, bundleIDs: [com.apple.dt.Xcode], keyPattern: '', titlePattern: "^(.+?) \u2014 "}

